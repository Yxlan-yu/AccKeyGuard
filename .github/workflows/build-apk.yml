name: Build AccGuard APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'apk/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: build-accguard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          build-root-directory: apk

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Verify signing keystore
        run: |
          test -f app/akg.keystore || { echo "::error ::app/akg.keystore missing"; exit 1; }
          keytool -list -keystore app/akg.keystore -storepass akg2026guard -alias akg | tail -n 3

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AccGuard-1.0.0.apk
          ls -l dist

      - name: Show outputs
        if: always()
        run: |
          ls -l app/build/outputs/apk/release/ || true
          ls -l app/build/outputs/logs/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: accguard-apk
          path: apk/dist/*.apk
          if-no-files-found: error

      - name: Upload build report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accguard-build-logs
          path: |
            apk/**/build/reports/**
            apk/**/build/outputs/logs/**
          if-no-files-found: ignore
