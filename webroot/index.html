<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>无障碍保活</title>
<link rel="stylesheet" href="https://mui.kernelsu.org/internal/insets.css">
<link rel="stylesheet" href="style.css?v=21">
<script>
/* 首屏防白闪：先用上次缓存的主题上色，稍后由 app.js 与模块配置校正 */
(function () {
  try {
    var saved = localStorage.getItem('akg.theme') || 'auto';
    var dark = saved === 'dark' || (saved === 'auto' && window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="topbar-row">
    <h1>无障碍保活</h1>
    <button id="btnSettings" class="icon-btn" type="button" aria-label="设置、守护状态与日志">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>
  <div class="status-row">
    <div id="statusChip" class="status-chip" role="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">正在读取…</span>
    </div>
    <span class="sync-note" id="syncNote" aria-live="polite"></span>
  </div>
</header>

<div class="toolbar">
  <div class="search" id="searchBox">
    <svg class="search-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5 21 21"></path>
    </svg>
    <input id="searchInput" type="search" placeholder="搜索应用名或包名" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="搜索无障碍服务">
    <button id="searchClear" class="search-clear" type="button" aria-label="清除搜索" hidden>×</button>
  </div>
  <div class="filter-wrap">
    <div class="filter-row" id="filterRow" role="tablist" aria-label="筛选"></div>
    <button id="btnSort" class="sort-btn" type="button" aria-haspopup="dialog" aria-label="排序方式">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 5v13M8 18l-3-3M8 18l3-3"></path>
        <path d="M16 19V6M16 6l-3 3M16 6l3 3"></path>
      </svg>
    </button>
  </div>
</div>

<div id="banner" class="banner" hidden>
  <span class="banner-text" id="bannerText"></span>
  <button class="banner-btn" id="bannerBtn" type="button" hidden></button>
</div>

<main>
  <div id="list" class="list" aria-live="polite"></div>
</main>

<div id="sheetHost"></div>
<div id="dialogHost"></div>
<div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="app.js?v=21"></script>
</body>
</html>
